<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATH × TECHNO — Reels engine</title>
<style>
@font-face{font-family:'STIX';src:url(fonts/STIXTwo.woff2) format('woff2');font-weight:400 700;font-style:normal}
@font-face{font-family:'STIX';src:url(fonts/STIXTwo-Italic.woff2) format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:'VT323';src:url(fonts/VT323.woff2) format('woff2')}
@font-face{font-family:'ShareTech';src:url(fonts/ShareTechMono.woff2) format('woff2')}
html,body{margin:0;background:#141414;color:#e6e6e6;font-family:'ShareTech',monospace;height:100%}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;box-sizing:border-box}
canvas{display:block;background:#141414}
body.render{padding:0;gap:0;display:block}
body.render canvas{width:1080px;height:1920px}
body:not(.render) canvas{height:calc(100vh - 110px);width:auto;max-width:100%;box-shadow:0 0 0 1px #232a30}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#bar button{background:#111417;color:#8b938d;border:1px solid #232a30;padding:6px 10px;font:inherit;cursor:pointer}
#bar button.on{color:#ffe600;border-color:#ffe600}
#bar button:hover{color:#ecead9}
#tl{width:min(100%,1080px);height:4px;background:#232a30;cursor:pointer;position:relative}
#tl i{position:absolute;left:0;top:0;bottom:0;background:#ffe600}
body.render #bar,body.render #tl{display:none}
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="tl"><i></i></div>
<script src="reels.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const RENDER = q.has('render');
  if (RENDER) document.body.classList.add('render');
  await Promise.all([
    document.fonts.load('400 100px STIX'), document.fonts.load('700 100px STIX'), document.fonts.load('italic 400 100px STIX'),
    document.fonts.load('400 100px VT323'), document.fonts.load('400 100px ShareTech')
  ]);
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let idx = Math.max(0, Math.min(REELS.length - 1, (parseInt(q.get('reel') || '1', 10) || 1) - 1));
  let t0 = performance.now(), paused = false, pauseT = 0;

  const bar = document.getElementById('bar');
  REELS.forEach((r, i) => {
    const b = document.createElement('button');
    b.textContent = String(i + 1).padStart(2, '0') + ' ' + r.short;
    b.onclick = () => { idx = i; t0 = performance.now(); paused = false; mark(); };
    bar.appendChild(b);
  });
  function mark(){ [...bar.children].forEach((b, i) => b.classList.toggle('on', i === idx)); }
  mark();
  const tl = document.getElementById('tl');
  tl.onclick = e => { const f = (e.clientX - tl.getBoundingClientRect().left) / tl.offsetWidth; t0 = performance.now() - f * DUR * 1000; };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (paused) pauseT = performance.now(); else t0 += performance.now() - pauseT; }
    if (e.code === 'ArrowRight') { idx = (idx + 1) % REELS.length; t0 = performance.now(); mark(); }
    if (e.code === 'ArrowLeft') { idx = (idx + REELS.length - 1) % REELS.length; t0 = performance.now(); mark(); }
  });

  window.__seek = (i, t) => { renderFrame(ctx, REELS[i], t); };
  window.__ready = true;
  if (RENDER) return;

  (function loop(){
    const now = paused ? pauseT : performance.now();
    const t = ((now - t0) / 1000) % DUR;
    renderFrame(ctx, REELS[idx], t);
    tl.firstElementChild.style.width = (t / DUR * 100) + '%';
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
